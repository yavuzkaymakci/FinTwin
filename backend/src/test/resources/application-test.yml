# Test profile: datasource and Kafka connections are provided by Testcontainers (see TestcontainersConfiguration).
logging:
  level:
    org.testcontainers: INFO
    org.apache.kafka: WARN

# The twin listener joins a consumer group; several cached test contexts would split its partitions. Only the
# twin pipeline test enables it.
fintwin:
  twin:
    consumer:
      enabled: false
