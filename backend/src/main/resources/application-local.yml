# Local development profile; matches the defaults in infra/docker-compose.yml.
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/fintwin}
    username: ${DB_USERNAME:fintwin}
    password: ${DB_PASSWORD:fintwin}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

logging:
  level:
    com.fintwin: DEBUG
