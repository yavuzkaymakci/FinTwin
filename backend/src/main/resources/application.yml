spring:
  application:
    name: fintwin-backend
  profiles:
    default: local
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
    placeholders:
      # Passwords of the read-only ML roles (V8); local defaults only.
      ml_password: ${ML_DB_PASSWORD:fintwin_ml}
      ml_labels_password: ${ML_LABELS_DB_PASSWORD:fintwin_ml_labels}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      compression-type: lz4
      batch-size: 262144
      properties:
        linger.ms: 10
        enable.idempotence: true
    consumer:
      group-id: fintwin-twin
      auto-offset-reset: earliest
      enable-auto-commit: false
      # Large batches: each batch rewrites the projection of every customer it touches once.
      max-poll-records: 20000
      fetch-min-size: 4194304
      fetch-max-wait: 500ms
      properties:
        max.partition.fetch.bytes: 16777216
        fetch.max.bytes: 67108864

  ai:
    model:
      # Chat provider of the assistants: none (default; assistants answer 503), anthropic or ollama. The profiles
      # "anthropic" and "ollama" set it; see CLAUDE.md / docs/assistants.md.
      chat: none
      embedding: none
    # Spring AI's own retry of model calls (default 10 attempts with minutes of back-off): keep a chat request short.
    retry:
      max-attempts: 2
      backoff:
        initial-interval: 1s
        multiplier: 2
        max-interval: 4s
    chat:
      memory:
        repository:
          jdbc:
            initialize-schema: never  # table created by Flyway V10

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

fintwin:
  ml:
    base-url: ${ML_SERVICE_URL:http://localhost:8000}
    connect-timeout: 2s
    read-timeout: 30s
    # Customers per /v1/risk/score/batch call (the ML service accepts up to 1000).
    batch-size: 500

  assistant:
    max-tool-calls: 8          # per chat request
    memory-messages: 20        # message window of the PostgreSQL chat memory
    rate-limit:
      requests: 20             # per user and assistant ...
      window: 10m              # ... in this sliding window
    max-wait-seconds: 60       # longest waitForRun the scenario assistant may block a request

resilience4j:
  retry:
    instances:
      mlService:
        max-attempts: 3
        wait-duration: 200ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        retry-exceptions:
          - org.springframework.web.client.ResourceAccessException
          - org.springframework.web.client.HttpServerErrorException
  circuitbreaker:
    instances:
      mlService:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 2
        record-exceptions:
          - org.springframework.web.client.ResourceAccessException
          - org.springframework.web.client.HttpServerErrorException
